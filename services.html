/* ============================================================
   APPLICATION DE LA LANGUE
   ============================================================ */

function applyLanguage(lang) {

  if (!translations[lang]) {
    lang = "pt";
  }

  document.documentElement.lang = lang;

  document
    .querySelectorAll("[data-i18n]")
    .forEach(function(element) {

      const key =
        element.getAttribute("data-i18n");

      if (
        translations[lang][key] !== undefined
      ) {

        element.textContent =
          translations[lang][key];

      }

    });

  localStorage.setItem(
    "cfo_selected_language",
    lang
  );
}


/* ============================================================
   OUVERTURE / FERMETURE DU MENU LANGUES
   ============================================================ */

function toggleLanguageMenu() {

  const dropdown =
    document.getElementById(
      "language-dropdown"
    );

  const button =
    document.querySelector(
      ".btn-lang-trigger"
    );

  if (!dropdown) {
    return;
  }

  const isOpen =
    dropdown.classList.toggle("show");

  if (button) {

    button.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );

  }

}


/* ============================================================
   CHANGEMENT DE LANGUE
   ============================================================ */

function translateSite(langCode) {

  if (
    langCode !== "fr" &&
    langCode !== "en" &&
    langCode !== "pt"
  ) {
    return;
  }

  applyLanguage(langCode);

  const dropdown =
    document.getElementById(
      "language-dropdown"
    );

  const button =
    document.querySelector(
      ".btn-lang-trigger"
    );

  if (dropdown) {

    dropdown.classList.remove("show");

  }

  if (button) {

    button.setAttribute(
      "aria-expanded",
      "false"
    );

  }

}


/* ============================================================
   COMPATIBILITÉ
   ============================================================ */

function translatePage(langCode) {
  translateSite(langCode);
}


/* ============================================================
   FERMETURE DU MENU SI ON CLIQUE AILLEURS
   ============================================================ */

document.addEventListener(
  "click",
  function(event) {

    const selector =
      document.querySelector(
        ".language-selector"
      );

    const dropdown =
      document.getElementById(
        "language-dropdown"
      );

    const button =
      document.querySelector(
        ".btn-lang-trigger"
      );

    if (
      selector &&
      dropdown &&
      !selector.contains(event.target)
    ) {

      dropdown.classList.remove("show");

      if (button) {

        button.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }

  }
);


/* ============================================================
   INITIALISATION
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    /* -----------------------------------------
       LANGUE
       ----------------------------------------- */

    const savedLanguage =
      localStorage.getItem(
        "cfo_selected_language"
      );

    if (savedLanguage) {

      applyLanguage(savedLanguage);

    } else {

      /*
       * PORTUGAIS PAR DÉFAUT
       */

      applyLanguage("pt");

    }


    /* -----------------------------------------
       HEADER AU DÉFILEMENT
       ----------------------------------------- */

    const header =
      document.querySelector("header");

    if (!header) {
      return;
    }

    let lastScrollTop =
      window.pageYOffset ||
      document.documentElement.scrollTop;


    window.addEventListener(
      "scroll",
      function() {

        const currentScrollTop =
          window.pageYOffset ||
          document.documentElement.scrollTop;


        /*
         * TOUT EN HAUT
         */

        if (currentScrollTop <= 10) {

          header.classList.remove(
            "header-hidden"
          );

          lastScrollTop =
            currentScrollTop;

          return;

        }


        /*
         * DESCENTE
         *
         * SEUL LE HEADER DISPARAÎT.
         *
         * LA TOP BAR RESTE TOUJOURS VISIBLE.
         */

        if (
          currentScrollTop >
          lastScrollTop
        ) {

          header.classList.add(
            "header-hidden"
          );

        }


        /*
         * REMONTÉE
         */

        else if (
          currentScrollTop <
          lastScrollTop
        ) {

          header.classList.remove(
            "header-hidden"
          );

        }


        lastScrollTop =
          currentScrollTop;

      },
      {
        passive: true
      }
    );

  }
);
